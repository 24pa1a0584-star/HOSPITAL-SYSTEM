<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="carenovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#FF7868" />
      <stop offset="100%" stop-color="#4169E1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(10, 6)" filter="url(#glow)">
    <!-- Rounded Shield / Leaf Background -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#carenovaGrad)" />
    <!-- Medical Heartbeat Pulse Line -->
    <path d="M8 24 L16 24 L20 14 L24 34 L28 18 L32 28 L36 24 L40 24" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Heart Accent Dot -->
    <circle cx="28" cy="18" r="2.5" fill="#FFE5D9" />
  </g>

  <!-- Typography: CARENOVA -->
  <text x="68" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="-0.5" fill="#132238">
    CARE<tspan fill="#0D9488">NOVA</tspan>
  </text>
  
  <!-- Subtle Tagline -->
  <text x="69" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="1.2" fill="#4169E1" text-transform="uppercase">
    SMART HOSPITAL SYSTEM
  </text>
</svg>
